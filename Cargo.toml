[package]
name = "rustsysteminfo"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
description = "Un clon moderno de Neofetch/Fastfetch en Rust"
license = "MIT"
repository = "https://github.com/Linuxero-dev/rustsysteminfo"
keywords = ["neofetch", "fastfetch", "system-information", "cli", "linux"]
categories = ["command-line-utilities"]

[[bin]]
name = "rsi"
path = "src/main.rs"

[dependencies]
sysinfo = "0.30"
crossterm = "0.27"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
