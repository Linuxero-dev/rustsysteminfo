name: Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths: [Cargo.toml, Cargo.lock]
  pull_request:
    paths: [Cargo.toml, Cargo.lock]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Instalar cargo-audit
        run: cargo install cargo-audit --locked --version 0.23.0
      - name: Buscar vulnerabilidades conocidas en las dependencias
        run: cargo audit
