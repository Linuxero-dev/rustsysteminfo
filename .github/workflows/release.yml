name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --release
      - run: cargo build --release
      - run: ./target/release/rsi --once

  build:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Instalar zig y cargo-zigbuild
        run: |
          curl -sL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz | tar -xJ -C /opt
          echo /opt/zig-linux-x86_64-0.13.0 >> $GITHUB_PATH
          cargo install cargo-zigbuild --locked
      - name: Compilar
        run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: Empaquetar
        run: |
          mkdir -p dist
          tar -czf dist/rsi-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release rsi
          cd dist && sha256sum rsi-${{ matrix.target }}.tar.gz > rsi-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rsi-${{ matrix.target }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
