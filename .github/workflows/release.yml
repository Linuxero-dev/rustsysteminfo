name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Permisos mínimos por defecto; el job de release amplía solo lo que necesita.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

# Las acciones están fijadas por SHA (el comentario indica la versión).
# Dependabot las mantiene al día: ver .github/dependabot.yml.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Comprobar que Cargo.lock está versionado
        run: test -f Cargo.lock
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: ./target/release/rsi --once
      - name: Probar el instalador
        run: ./scripts/test-install.sh
      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh

  build:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verificar que el tag coincide con la versión de Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "v$version" = "$GITHUB_REF_NAME"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # setup-zig descarga Zig y verifica su firma minisign.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0
      - name: Instalar cargo-zigbuild
        run: cargo install cargo-zigbuild --locked --version 0.24.1
      - name: Compilar
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Empaquetar
        run: |
          mkdir -p dist
          tar -czf "dist/rsi-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" rsi \
            -C "$GITHUB_WORKSPACE/man" rsi.1
          cd dist
          sha256sum "rsi-${{ matrix.target }}.tar.gz" > "rsi-${{ matrix.target }}.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rsi-${{ matrix.target }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      # Procedencia verificable: gh attestation verify <fichero> --repo Linuxero-dev/rustsysteminfo
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*.tar.gz
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
